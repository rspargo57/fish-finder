name: Nightly build + deploy
on:
  schedule:
    - cron: '5 22 * * *'
  workflow_dispatch:
concurrency:
  group: nightly-fishfinder
  cancel-in-progress: false
jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install Python dependencies
        run: pip install --upgrade pip && pip install requests pillow lxml python-dateutil
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install wrangler v3
        run: npm install -g wrangler@3
      - name: Show environment
        run: |
          python3 --version
          node --version
          wrangler --version | tail -1
      - name: Run build-inlined.py
        timeout-minutes: 25
        run: python3 build-inlined.py
      - name: Deploy to Cloudflare Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: bash safe-deploy.sh
      - name: Commit archive snapshot back to repo
        run: |
          git config user.name "Fish Finder Nightly"
          git config user.email "actions@github.com"
          git add archive/ data/ 2>/dev/null || true
          if git diff --staged --quiet; then
            echo "No archive/data changes to commit."
          else
            git commit -m "Nightly $(date -u +%Y-%m-%d) — archive + refreshed data"
            git push
          fi
        continue-on-error: true
      - name: Post-flight verification
        run: |
          TODAY=$(date -u +%Y-%m-%d)
          LIVE=$(curl -sfL --max-time 30 --range 0-2000000 https://fishfinders.app/map \
                 | grep -oE '"generated_at": ?"?[0-9T:.Z-]+"?' | head -1 \
                 | grep -oE '20[0-9]{2}-[0-9]{2}-[0-9]{2}')
          echo "Today (UTC): $TODAY / Live: $LIVE"
          if [ "$LIVE" != "$TODAY" ]; then
            echo "::error::Post-flight FAIL: live is $LIVE, expected $TODAY"
            exit 1
          fi
          curl -sfL https://fishfinders.app/_bootstrap-3e9f4a2c8d1b7f/ff-src.tar.gz -o /tmp/pf.tar.gz
          if ! tar tzf /tmp/pf.tar.gz | grep -qE '^safe-deploy\.sh$'; then
            echo "::error::Tarball missing safe-deploy.sh — Sept 15-21 bug recurred"
            exit 1
          fi
          echo "✅ Post-flight OK."
